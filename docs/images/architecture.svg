<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1080" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <!-- ================= Wanderlust — End-to-End DevSecOps / GitOps Architecture ================= -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/>
    </marker>
    <style>
      .zone  { rx:16; ry:16; stroke-width:2; }
      .card  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:10; ry:10; }
      .ztitle{ font-size:17px; font-weight:700; letter-spacing:.3px; }
      .h     { font-size:14px; font-weight:700; fill:#0f172a; }
      .t     { font-size:12.5px; fill:#334155; }
      .s     { font-size:11px; fill:#64748b; }
      .lbl   { font-size:11.5px; fill:#475569; font-weight:600; }
      .flow  { fill:none; stroke:#334155; stroke-width:2; }
      .flowB { fill:none; stroke:#2563eb; stroke-width:2; }
      .flowO { fill:none; stroke:#ea580c; stroke-width:2; }
      .dash  { stroke-dasharray:6 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1540" height="1080" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="44" font-size="28" font-weight="800" fill="#0f172a">Wanderlust — DevSecOps &amp; GitOps on AWS EKS</text>
  <text x="40" y="70" font-size="15" fill="#475569">MERN app · Terraform-provisioned EKS · Jenkins CI (security-scanned) · ArgoCD pull-based GitOps</text>

  <!-- ===================== LEFT: CI / CD plane ===================== -->
  <rect class="zone" x="30" y="92" width="430" height="900" fill="#eef2ff" stroke="#6366f1"/>
  <text class="ztitle" x="50" y="120" fill="#4338ca">① CI / CD PLANE  ·  Jenkins on EC2</text>

  <!-- Developer -->
  <rect class="card" x="150" y="138" width="190" height="52"/>
  <circle cx="178" cy="164" r="12" fill="#6366f1"/>
  <text class="h" x="200" y="160">Developer</text>
  <text class="s" x="200" y="178">git push (app code)</text>

  <!-- App repo -->
  <rect class="card" x="120" y="214" width="250" height="52"/>
  <rect x="134" y="228" width="22" height="22" rx="4" fill="#24292f"/>
  <text class="h" x="166" y="236">GitHub · App Repo</text>
  <text class="s" x="166" y="254">devOps-Full-Project</text>

  <!-- Jenkins CI box -->
  <rect x="60" y="294" width="370" height="340" rx="12" fill="#ffffff" stroke="#d33833" stroke-width="2"/>
  <rect x="60" y="294" width="370" height="34" rx="12" fill="#d33833"/>
  <text x="78" y="316" font-size="14" font-weight="700" fill="#ffffff">Jenkins — CI Pipeline (declarative)</text>

  <rect class="card" x="78" y="342" width="334" height="36"/>
  <text class="t" x="92" y="365"><tspan font-weight="700">1 · 2</tspan>  Checkout  →  Trivy filesystem scan</text>
  <rect class="card" x="78" y="386" width="334" height="36"/>
  <text class="t" x="92" y="409"><tspan font-weight="700">3</tspan>  OWASP Dependency-Check (SCA)</text>
  <rect class="card" x="78" y="430" width="334" height="36"/>
  <text class="t" x="92" y="453"><tspan font-weight="700">4</tspan>  SonarQube analysis + Quality Gate</text>
  <rect class="card" x="78" y="474" width="334" height="36"/>
  <text class="t" x="92" y="497"><tspan font-weight="700">5</tspan>  Docker build (multi-stage)</text>
  <rect class="card" x="78" y="518" width="334" height="36"/>
  <text class="t" x="92" y="541"><tspan font-weight="700">6</tspan>  Push images → Docker Hub</text>
  <rect class="card" x="78" y="562" width="334" height="54"/>
  <text class="t" x="92" y="582"><tspan font-weight="700">7</tspan>  on success → trigger CD pipeline</text>
  <text class="s" x="92" y="601">SonarQube ⇄ Jenkins via webhook (HMAC)</text>

  <!-- Docker Hub -->
  <rect class="card" x="60" y="654" width="175" height="56"/>
  <rect x="74" y="670" width="22" height="22" rx="4" fill="#2496ed"/>
  <text class="h" x="104" y="680">Docker Hub</text>
  <text class="s" x="104" y="697">image registry</text>

  <!-- Jenkins CD -->
  <rect x="255" y="654" width="175" height="56" rx="10" fill="#ffffff" stroke="#d33833" stroke-width="1.8"/>
  <text class="h" x="270" y="677">Jenkins — CD</text>
  <text class="s" x="270" y="695">bump image tag → push</text>

  <!-- SonarQube note card -->
  <rect class="card" x="60" y="730" width="370" height="54"/>
  <rect x="74" y="744" width="22" height="22" rx="4" fill="#4e9bcd"/>
  <text class="h" x="104" y="752">SonarQube · Trivy · OWASP</text>
  <text class="s" x="104" y="770">shift-left security &amp; quality scanning</text>

  <!-- flows inside CI plane -->
  <path class="flow" d="M245 190 V214" marker-end="url(#arrow)"/>
  <path class="flow" d="M245 266 V294" marker-end="url(#arrow)"/>
  <path class="flow" d="M160 616 V654" marker-end="url(#arrow)"/>
  <path class="flow" d="M300 616 V654" marker-end="url(#arrow)"/>

  <!-- ===================== MIDDLE: Git = source of truth ===================== -->
  <rect class="zone" x="488" y="300" width="196" height="300" fill="#fef9c3" stroke="#ca8a04"/>
  <text class="ztitle" x="506" y="328" fill="#a16207" font-size="15">② GIT</text>
  <text class="s" x="506" y="346" fill="#a16207">single source of truth</text>

  <rect class="card" x="506" y="366" width="160" height="70"/>
  <rect x="520" y="380" width="20" height="20" rx="4" fill="#24292f"/>
  <text class="h" x="548" y="389">K8s Manifests</text>
  <text class="s" x="520" y="414">Deployments, Services,</text>
  <text class="s" x="520" y="430">Ingress, Argo App</text>

  <rect class="card" x="506" y="470" width="160" height="60"/>
  <text class="t" x="520" y="494">CD writes new</text>
  <text class="t" x="520" y="512">image tag here</text>

  <!-- CD -> manifests -->
  <path class="flowO" d="M430 682 C470 682 486 560 505 500" marker-end="url(#arrowOrange)"/>
  <text class="lbl" x="440" y="640" fill="#ea580c">git push</text>

  <!-- ===================== RIGHT: AWS Cloud / EKS ===================== -->
  <rect class="zone" x="712" y="92" width="796" height="900" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="ztitle" x="734" y="120" fill="#b45309">③ AWS CLOUD  ·  Region us-east-2  ·  default VPC (3 AZs)</text>

  <!-- Terraform banner -->
  <rect x="734" y="134" width="752" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="746" y="144" width="20" height="20" rx="4" fill="#7b42bc"/>
  <text class="t" x="776" y="159"><tspan font-weight="700" fill="#5b21b6">Terraform (IaC)</tspan>  provisions everything below → EKS · IAM roles · OIDC · IRSA · Helm releases  (15 resources · create/destroy daily)</text>

  <!-- EKS cluster box -->
  <rect x="734" y="190" width="752" height="690" rx="12" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
  <rect x="734" y="190" width="752" height="34" rx="12" fill="#326ce5"/>
  <text x="752" y="212" font-size="14" font-weight="700" fill="#ffffff">Amazon EKS Cluster  ·  "wanderlust"  ·  Kubernetes v1.34</text>

  <!-- Control plane -->
  <rect class="card" x="752" y="238" width="340" height="58"/>
  <text class="h" x="768" y="262">Control plane (AWS-managed)</text>
  <text class="s" x="768" y="281">API server · scheduler · etcd · OIDC issuer</text>

  <!-- IRSA / LB controller -->
  <rect class="card" x="1108" y="238" width="360" height="58"/>
  <text class="h" x="1124" y="262">AWS LB Controller  +  IRSA</text>
  <text class="s" x="1124" y="281">OIDC-federated role → creates the NLB</text>

  <!-- ArgoCD -->
  <rect x="752" y="312" width="340" height="66" rx="10" fill="#fff" stroke="#ef7b4d" stroke-width="2"/>
  <rect x="766" y="328" width="22" height="22" rx="4" fill="#ef7b4d"/>
  <text class="h" x="796" y="338">ArgoCD  (GitOps engine)</text>
  <text class="s" x="766" y="360">watches Git repo · auto-sync · self-heal · prune</text>

  <!-- Worker nodes band -->
  <rect x="752" y="398" width="716" height="320" rx="10" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="lbl" x="768" y="420" fill="#0369a1">Managed node group · 2× c7i-flex.large (2 vCPU / 4 GB) · namespace: wanderlust</text>

  <!-- NLB -->
  <rect class="card" x="768" y="436" width="150" height="58"/>
  <rect x="780" y="450" width="20" height="20" rx="4" fill="#ff9900"/>
  <text class="h" x="808" y="459">AWS NLB</text>
  <text class="s" x="784" y="482">internet-facing</text>

  <!-- NGINX -->
  <rect class="card" x="950" y="436" width="180" height="58"/>
  <rect x="964" y="450" width="20" height="20" rx="4" fill="#009639"/>
  <text class="h" x="992" y="459">NGINX Ingress</text>
  <text class="s" x="964" y="482">path routing / · /api</text>

  <!-- services -->
  <rect class="card" x="768" y="528" width="175" height="54"/>
  <text class="h" x="782" y="550">frontend-service</text>
  <text class="s" x="782" y="568">ClusterIP</text>
  <rect class="card" x="768" y="602" width="175" height="54"/>
  <text class="h" x="782" y="624">backend-service</text>
  <text class="s" x="782" y="642">ClusterIP</text>

  <!-- pods -->
  <rect class="card" x="975" y="528" width="155" height="54"/>
  <text class="h" x="989" y="550">frontend pod</text>
  <text class="s" x="989" y="568">React / Vite :5173</text>
  <rect class="card" x="975" y="602" width="155" height="54"/>
  <text class="h" x="989" y="624">backend pod</text>
  <text class="s" x="989" y="642">Node/Express :8080</text>

  <!-- data stores -->
  <rect class="card" x="1162" y="528" width="150" height="54"/>
  <rect x="1176" y="542" width="20" height="20" rx="4" fill="#13aa52"/>
  <text class="h" x="1204" y="550">MongoDB</text>
  <text class="s" x="1176" y="568">pod + PV/PVC</text>
  <rect class="card" x="1162" y="602" width="150" height="54"/>
  <rect x="1176" y="616" width="20" height="20" rx="4" fill="#d82c20"/>
  <text class="h" x="1204" y="624">Redis</text>
  <text class="s" x="1176" y="642">cache</text>

  <!-- internal flow arrows -->
  <path class="flow" d="M918 465 H950" marker-end="url(#arrow)"/>
  <path class="flow" d="M1000 494 V528" marker-end="url(#arrow)"/>
  <path class="flow" d="M1040 494 V602" marker-end="url(#arrow)"/>
  <path class="flow" d="M943 555 H975" marker-end="url(#arrow)"/>
  <path class="flow" d="M943 629 H975" marker-end="url(#arrow)"/>
  <path class="flow dash" d="M1130 629 H1162" marker-end="url(#arrow)"/>
  <text class="s" x="1070" y="700">backend ⇄ MongoDB / Redis (internal ClusterIP + CoreDNS)</text>

  <!-- ArgoCD applies to cluster -->
  <path class="flowO" d="M922 345 C1000 345 980 410 980 436" marker-end="url(#arrowOrange)"/>
  <text class="lbl" x="930" y="400" fill="#ea580c">kubectl apply (sync)</text>

  <!-- ===================== Cross-plane flows ===================== -->
  <!-- ArgoCD watches Git manifests -->
  <path class="flowO dash" d="M666 430 C700 400 710 360 751 345" marker-end="url(#arrowOrange)"/>
  <text class="lbl" x="612" y="380" fill="#ea580c">ArgoCD pulls</text>

  <!-- Docker Hub -> pods pull images -->
  <path class="flowB dash" d="M235 686 C430 900 820 820 974 582" marker-end="url(#arrowBlue)"/>
  <text class="lbl" x="560" y="870" fill="#2563eb">nodes pull images from Docker Hub</text>

  <!-- Users -->
  <rect class="card" x="1330" y="905" width="178" height="56"/>
  <circle cx="1358" cy="933" r="12" fill="#0ea5e9"/>
  <text class="h" x="1380" y="929">End users</text>
  <text class="s" x="1380" y="947">HTTP · internet</text>
  <path class="flowB" d="M1420 905 C1420 760 980 640 843 494" marker-end="url(#arrowBlue)"/>
  <text class="lbl" x="1180" y="770" fill="#2563eb">browser → NLB → NGINX → services → pods</text>

  <!-- footer legend -->
  <text class="s" x="40" y="1030">Flow:  black = build/deploy steps   ·   blue = runtime user &amp; image traffic   ·   orange = GitOps (pull-based) sync</text>
  <text class="s" x="40" y="1050">Security scanning (Trivy · OWASP Dependency-Check · SonarQube Quality Gate) gates every CI build before an image is ever pushed.</text>
</svg>
