<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 1320" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arwB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arwG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arwD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
    <style>
      .t{font-weight:700;fill:#0f172a}.s{fill:#334155}.n{fill:#64748b;font-size:12px}
      .bt{font-weight:700;font-size:14px;fill:#0f172a}.bs{font-size:12px;fill:#334155}
      .port{font-weight:700;font-size:12px;fill:#7c3aed}.zl{font-weight:700;fill:#334155}
      .stepc{fill:#0f172a}.stepn{fill:#fff;font-weight:700;font-size:14px;text-anchor:middle}
      .lh{font-weight:700;font-size:15px;fill:#0f172a}.lt{font-size:12.5px;fill:#1e293b}
      .flow{stroke:#334155;stroke-width:2.5;fill:none}
      .flowB{stroke:#2563eb;stroke-width:2.5;fill:none}
      .flowG{stroke:#16a34a;stroke-width:2.5;fill:none}
      .dns{stroke:#9333ea;stroke-width:2;stroke-dasharray:5 4;fill:none}
    </style>
  </defs>

  <rect width="1740" height="1320" fill="#f8fafc"/>
  <text x="34" y="40" class="t" font-size="24">Wanderlust on EKS — Full Request Flow ①→⑧</text>
  <text x="34" y="64" class="s" font-size="15">Approach 1: AWS Application Load Balancer (ALB) + Ingress — path routing happens INSIDE the ALB (in AWS)</text>

  <!-- ============ INTERNET ZONE ============ -->
  <rect x="24" y="84" width="1180" height="118" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="40" y="106" class="zl" font-size="13">🌐 INTERNET  (outside AWS)</text>

  <!-- Browser -->
  <rect x="44" y="116" width="300" height="74" rx="10" fill="#fff" stroke="#6366f1" stroke-width="2"/>
  <text x="58" y="138" class="bt">① User Browser</text>
  <text x="58" y="157" class="bs">https://wanderlust.example.com</text>
  <text x="58" y="174" class="bs">SPA runs: axios.get(<tspan fill="#7c3aed" font-weight="700">'/api/posts'</tspan>) — relative</text>

  <!-- Route53 -->
  <rect x="470" y="116" width="270" height="74" rx="10" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <text x="484" y="138" class="bt">Route 53 (DNS)</text>
  <text x="484" y="157" class="bs">name → the ALB's address</text>
  <text x="484" y="174" class="n">resolves NAME→IP only (no ports)</text>

  <!-- Control plane -->
  <rect x="820" y="110" width="360" height="84" rx="10" fill="#e5e7eb" stroke="#94a3b8" stroke-width="2"/>
  <text x="836" y="132" class="bt">EKS Control Plane</text>
  <text x="836" y="151" class="bs">AWS-managed · hidden · multi-AZ</text>
  <text x="836" y="169" class="n">NOT in the request path. Prepares</text>
  <text x="836" y="184" class="n">routing rules on nodes in advance.</text>

  <!-- DNS arrow -->
  <path class="dns" d="M344,150 L466,150" marker-end="url(#arwD)"/>
  <text x="352" y="142" class="n" fill="#9333ea">DNS lookup</text>

  <!-- ============ VPC ZONE ============ -->
  <rect x="24" y="214" width="1180" height="1080" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="40" y="238" class="zl" font-size="13">🏢 VPC  (2 Availability Zones · public + private subnets · IGW + NAT)</text>

  <!-- Public subnet + ALB -->
  <rect x="40" y="250" width="1148" height="118" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="54" y="271" class="zl" font-size="12">PUBLIC SUBNET</text>
  <rect x="300" y="258" width="600" height="102" rx="10" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
  <text x="316" y="281" class="bt" fill="#fff">② AWS ALB  (Layer 7)</text>
  <text x="316" y="300" class="bs" fill="#fff">🔒 TLS terminates here (ACM cert) · port 443</text>
  <text x="316" y="320" class="bs" fill="#fff">Listener rules (path routing IN the ALB):</text>
  <text x="316" y="339" class="bs" fill="#fff">   /  →  frontend target-group      /api  →  backend target-group</text>
  <text x="316" y="355" class="n" fill="#fff7ed">③ ALB forwards to the target group's pods (IP mode)</text>

  <!-- LB controller -->
  <rect x="928" y="262" width="248" height="94" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="942" y="283" class="bt" font-size="13">AWS LB Controller</text>
  <text x="942" y="301" class="n">a pod in the cluster that WATCHES</text>
  <text x="942" y="316" class="n">your Ingress → creates the ALB +</text>
  <text x="942" y="331" class="n">target groups, and keeps the TG</text>
  <text x="942" y="346" class="n">synced as pods come &amp; go.</text>
  <path class="dns" d="M928,300 L902,300" marker-end="url(#arwD)"/>

  <!-- Browser -> ALB flow -->
  <path class="flowB" d="M194,190 L194,244 Q194,258 210,258 L360,258 L400,262" marker-end="url(#arwB)"/>
  <text x="204" y="232" class="n" fill="#2563eb">② HTTPS 443 → ALB</text>

  <!-- ============ EKS CLUSTER ============ -->
  <rect x="40" y="384" width="1148" height="892" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="56" y="407" class="zl" font-size="13">☸️ EKS CLUSTER  (worker nodes in PRIVATE subnets · kube-proxy on every node)</text>

  <!-- Edge services -->
  <rect x="120" y="424" width="250" height="78" rx="10" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="134" y="446" class="bt">frontend-service</text>
  <text x="134" y="464" class="bs">type ClusterIP (virtual)</text>
  <text x="134" y="483" class="port">port 5173  →  targetPort 5173</text>
  <text x="134" y="497" class="n">selector: app=frontend</text>

  <rect x="600" y="424" width="250" height="78" rx="10" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="614" y="446" class="bt">backend-service</text>
  <text x="614" y="464" class="bs">type ClusterIP (virtual)</text>
  <text x="614" y="483" class="port">port 8080  →  targetPort 8080</text>
  <text x="614" y="497" class="n">selector: app=backend</text>

  <!-- ALB -> services -->
  <path class="flow" d="M360,360 L360,392 Q360,406 346,406 L245,406 L245,420" marker-end="url(#arw)"/>
  <text x="250" y="380" class="n">③ /  →</text>
  <path class="flow" d="M720,360 L720,420" marker-end="url(#arw)"/>
  <text x="726" y="380" class="n">③ /api  →</text>

  <!-- kube-proxy band -->
  <rect x="120" y="520" width="730" height="34" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="134" y="542" class="bs">④ <tspan font-weight="700">kube-proxy</tspan> (on each node): rewrites  ClusterIP:port → a live pod IP:targetPort  · picks a pod via Endpoints (the label match)</text>

  <!-- App pods row -->
  <rect x="120" y="572" width="170" height="78" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="134" y="594" class="bt" font-size="13">frontend pod</text>
  <text x="134" y="612" class="port">:5173</text>
  <text x="134" y="629" class="n">app=frontend</text>
  <text x="134" y="645" class="n">Node 1</text>

  <rect x="300" y="572" width="170" height="78" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="314" y="594" class="bt" font-size="13">frontend pod</text>
  <text x="314" y="612" class="port">:5173</text>
  <text x="314" y="629" class="n">app=frontend</text>
  <text x="314" y="645" class="n">Node 2</text>

  <rect x="600" y="572" width="170" height="78" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="614" y="594" class="bt" font-size="13">backend pod</text>
  <text x="614" y="612" class="port">:8080</text>
  <text x="614" y="629" class="n">app=backend</text>
  <text x="614" y="645" class="n">Node 1</text>

  <rect x="790" y="572" width="170" height="78" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="804" y="594" class="bt" font-size="13">backend pod</text>
  <text x="804" y="612" class="port">:8080</text>
  <text x="804" y="629" class="n">app=backend</text>
  <text x="804" y="645" class="n">Node 2</text>

  <!-- service -> pods (selector dashed) -->
  <path class="dns" d="M200,502 L200,568" marker-end="url(#arwD)"/>
  <path class="dns" d="M300,502 Q360,535 385,568" marker-end="url(#arwD)"/>
  <path class="dns" d="M690,502 L690,568" marker-end="url(#arwD)"/>
  <path class="dns" d="M780,502 Q840,535 865,568" marker-end="url(#arwD)"/>

  <!-- backend -> data services -->
  <text x="600" y="695" class="n" fill="#16a34a">⑤ backend calls DBs BY NAME (any healthy pod handles it)</text>

  <!-- CoreDNS -->
  <rect x="120" y="700" width="190" height="72" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="134" y="722" class="bt" font-size="13">CoreDNS</text>
  <text x="134" y="740" class="bs">⑥ name → ClusterIP</text>
  <text x="134" y="757" class="n">(cluster-internal DNS)</text>

  <!-- data services -->
  <rect x="360" y="700" width="230" height="72" rx="10" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="374" y="722" class="bt">mongo-service</text>
  <text x="374" y="740" class="bs">ClusterIP · <tspan class="port">port 27017</tspan></text>
  <text x="374" y="757" class="n">selector: app=mongo</text>

  <rect x="640" y="700" width="230" height="72" rx="10" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="654" y="722" class="bt">redis-service</text>
  <text x="654" y="740" class="bs">ClusterIP · <tspan class="port">port 6379</tspan></text>
  <text x="654" y="757" class="n">selector: app=redis</text>

  <path class="flowG" d="M660,652 Q560,675 500,696" marker-end="url(#arwG)"/>
  <path class="flowG" d="M700,652 Q740,675 755,696" marker-end="url(#arwG)"/>
  <path class="dns" d="M310,736 L356,736" marker-end="url(#arwD)"/>

  <!-- DB pods -->
  <rect x="360" y="812" width="230" height="76" rx="10" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="374" y="834" class="bt">mongo pod</text>
  <text x="374" y="852" class="port">:27017</text>
  <text x="374" y="870" class="n">app=mongo · Node 1</text>

  <rect x="640" y="812" width="230" height="76" rx="10" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="654" y="834" class="bt">redis pod</text>
  <text x="654" y="852" class="port">:6379</text>
  <text x="654" y="870" class="n">app=redis · Node 2</text>

  <path class="flow" d="M475,772 L475,808" marker-end="url(#arw)"/>
  <text x="482" y="792" class="n">⑦ kube-proxy → pod</text>
  <path class="flow" d="M755,772 L755,808" marker-end="url(#arw)"/>

  <!-- storage -->
  <rect x="360" y="920" width="350" height="66" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="374" y="942" class="bt" font-size="13">⑧ mongo-pvc → mongo-pv  (EBS volume)</text>
  <text x="374" y="961" class="bs">durable data — survives pod restarts</text>
  <text x="374" y="978" class="n">on EKS needs the EBS CSI driver to bind</text>
  <path class="flow" d="M475,888 L475,916" marker-end="url(#arw)"/>

  <!-- return note -->
  <rect x="120" y="1010" width="960" height="60" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="134" y="1034" class="bt" font-size="13">↩︎ Response path (reverse):</text>
  <text x="134" y="1055" class="bs">mongo/redis pod → backend pod → ALB → browser.  React renders the blog feed. Same hops, backwards.</text>

  <!-- two-LB-layers callout -->
  <rect x="120" y="1092" width="960" height="70" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="134" y="1114" class="bt" font-size="13">⚖️ TWO load-balancing layers</text>
  <text x="134" y="1134" class="bs"><tspan font-weight="700">Layer 1 — AWS ALB</tspan>: spreads across NODES / registers pod IPs.   <tspan font-weight="700">Layer 2 — kube-proxy</tspan>: spreads across PODS.</text>
  <text x="134" y="1152" class="n">Neither replaces the other. The control plane is never in this path — it only set up the routing rules ahead of time.</text>

  <!-- backend not public callout -->
  <rect x="120" y="1184" width="960" height="66" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="134" y="1206" class="bt" font-size="13">✅ Why this design wins</text>
  <text x="134" y="1226" class="bs">No node IPs anywhere · backend is ClusterIP-only (never public) · relative <tspan class="port">/api</tspan> = no CORS · one image works everywhere.</text>
  <text x="134" y="1243" class="n">Nodes/pods churn freely — the ALB DNS name never changes. The whole "export env vars / hardcoded instance-id" hack disappears.</text>

  <!-- ============ LEGEND COLUMN ============ -->
  <!-- Steps -->
  <rect x="1220" y="84" width="496" height="392" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1240" y="112" class="lh">🧭 Request flow — step by step</text>
  <text x="1240" y="140" class="lt">① Browser has the SPA; runs <tspan fill="#7c3aed">axios.get('/api/posts')</tspan> —</text>
  <text x="1258" y="158" class="lt">a RELATIVE URL → same origin it loaded from.</text>
  <text x="1240" y="182" class="lt">② DNS (Route53): name → ALB address. Browser</text>
  <text x="1258" y="200" class="lt">opens HTTPS 443 to the ALB; TLS ends there (ACM).</text>
  <text x="1240" y="224" class="lt">③ ALB listener rule matches the PATH: /api → the</text>
  <text x="1258" y="242" class="lt">backend target group (/ → frontend). Routing is</text>
  <text x="1258" y="260" class="lt">done IN the ALB (AWS), not by a cluster pod.</text>
  <text x="1240" y="284" class="lt">④ Lands in the cluster; kube-proxy picks a healthy</text>
  <text x="1258" y="302" class="lt">backend pod (by label via Endpoints) → pod:8080.</text>
  <text x="1240" y="326" class="lt">⑤ Backend needs data → calls mongo-service /</text>
  <text x="1258" y="344" class="lt">redis-service BY NAME (no port for mongo → the</text>
  <text x="1258" y="362" class="lt">mongodb:// default 27017 is implied).</text>
  <text x="1240" y="386" class="lt">⑥ CoreDNS resolves the name → the ClusterIP.</text>
  <text x="1240" y="410" class="lt">⑦ kube-proxy rewrites ClusterIP → a mongo/redis</text>
  <text x="1258" y="428" class="lt">pod IP → pod:27017 / :6379.</text>
  <text x="1240" y="452" class="lt">⑧ Mongo persists to its PVC→PV (EBS). Response</text>
  <text x="1258" y="470" class="lt">flows back up to the browser.</text>

  <!-- Ports -->
  <rect x="1220" y="492" width="496" height="330" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1240" y="520" class="lh">🔌 Ports cheat-sheet</text>
  <text x="1240" y="548" class="lt"><tspan font-weight="700">containerPort</tspan> (Deployment) = where the APP listens</text>
  <text x="1258" y="566" class="lt">inside the pod. Dev decides it. Informational.</text>
  <text x="1240" y="590" class="lt"><tspan font-weight="700">targetPort</tspan> (Service) = the pod port to forward TO.</text>
  <text x="1258" y="608" class="lt">Must equal containerPort.</text>
  <text x="1240" y="632" class="lt"><tspan font-weight="700">port</tspan> (Service) = the Service's OWN door — what</text>
  <text x="1258" y="650" class="lt">callers dial: <tspan fill="#7c3aed">backend-service:8080</tspan>. You choose it.</text>
  <text x="1240" y="674" class="lt"><tspan font-weight="700">nodePort</tspan> (30000–32767) = a port opened on EVERY</text>
  <text x="1258" y="692" class="lt">node's IP for external access (not used here — ALB).</text>
  <text x="1240" y="722" class="lt" font-weight="700">App ports in this project:</text>
  <text x="1240" y="744" class="lt">frontend 5173 · backend 8080 · mongo 27017 · redis 6379</text>
  <text x="1240" y="766" class="lt">ALB 443 (HTTPS, TLS terminates)</text>
  <text x="1240" y="794" class="lt" fill="#7c3aed">You only write a port when it's NOT the scheme's</text>
  <text x="1240" y="812" class="lt" fill="#7c3aed">default (8080≠http's 80 → written; 27017=mongo's → not).</text>

  <!-- Concepts -->
  <rect x="1220" y="838" width="496" height="446" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1240" y="866" class="lh">🧠 Key concepts (interview-ready)</text>
  <text x="1240" y="894" class="lt">• <tspan font-weight="700">Service types are cumulative</tspan>: NodePort still</text>
  <text x="1258" y="912" class="lt">has a ClusterIP; LoadBalancer has all three.</text>
  <text x="1240" y="936" class="lt">• <tspan font-weight="700">ClusterIP is virtual</tspan> — no machine has it. kube-</text>
  <text x="1258" y="954" class="lt">proxy rewrites (ClusterIP:port)→(pod IP:targetPort).</text>
  <text x="1240" y="978" class="lt">• <tspan font-weight="700">DNS gives only NAME→IP</tspan>. Ports never live in</text>
  <text x="1258" y="996" class="lt">DNS — they come from the URL / scheme default.</text>
  <text x="1240" y="1020" class="lt">• <tspan font-weight="700">Labels are the glue</tspan>: Deployment stamps</text>
  <text x="1258" y="1038" class="lt">app=backend on pods; Service selector finds them.</text>
  <text x="1258" y="1056" class="lt">Pod location/IP is irrelevant — tracked by label.</text>
  <text x="1240" y="1080" class="lt">• <tspan font-weight="700">Control plane ≠ data path</tspan>. It plans pod</text>
  <text x="1258" y="1098" class="lt">placement + pushes rules to kube-proxy in advance;</text>
  <text x="1258" y="1116" class="lt">live traffic never touches it.</text>
  <text x="1240" y="1140" class="lt">• <tspan font-weight="700">CoreDNS</tspan> = 2 central pods (not per-node).</text>
  <text x="1240" y="1164" class="lt">• <tspan font-weight="700">Default add-ons</tspan> auto-install: VPC CNI (pod IPs),</text>
  <text x="1258" y="1182" class="lt">kube-proxy, CoreDNS — all run ON worker nodes.</text>
  <text x="1240" y="1206" class="lt">• <tspan font-weight="700">ALB path routing</tspan> = listener rules → per-service</text>
  <text x="1258" y="1224" class="lt">target groups. The LB Controller builds &amp; syncs them.</text>
  <text x="1240" y="1248" class="lt">• <tspan font-weight="700">EKS control plane</tspan>: flat $0.10/hr, AWS-managed,</text>
  <text x="1258" y="1266" class="lt">no instance to size. You only size worker nodes.</text>

  <text x="34" y="1306" class="n">Approach 1 of 2 · AWS ALB (path routing in AWS) · pair with Approach 2 (NGINX Ingress) · Wanderlust MERN on EKS</text>
</svg>
